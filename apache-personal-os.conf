<VirtualHost *:80>
    ServerName personal-os.local
    DocumentRoot "C:/xampp/htdocs/personal-os"

    <Directory "C:/xampp/htdocs/personal-os">
        AllowOverride All
        Require all granted
    </Directory>

    Redirect permanent / https://personal-os.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName personal-os.local
    DocumentRoot "C:/xampp/htdocs/personal-os"

    <Directory "C:/xampp/htdocs/personal-os">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/server.key"
</VirtualHost>
